<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="apple-mobile-web-app-capable" content="yes"><title>My Daily Routine</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f5f5f7;margin:0}.app{max-width:900px;margin:auto;padding:20px}.card{background:white;border-radius:18px;padding:16px;margin:12px 0}.row{display:grid;grid-template-columns:35px 90px 1fr;gap:8px;padding:12px 0;border-bottom:1px solid #eee}.done span:last-child{text-decoration:line-through;color:#888}.stats{display:flex;gap:10px}.stat{flex:1;background:#f2f2f4;padding:12px;border-radius:12px}.stat b{font-size:24px;display:block}.bar{height:10px;background:#ddd;border-radius:9px;margin-top:12px}.fill{height:100%;background:#111;border-radius:9px;width:0}button{padding:10px 14px;border:0;border-radius:10px;background:#111;color:white;margin:3px}button.secondary{background:#e8e8eb;color:#111}.time{color:#666;font-size:13px}.detail{display:block;color:#888;font-size:12px}</style></head><body><main class="app"><h1>My Daily Routine</h1><p id="date"></p><div class="card"><div class="stats"><div class="stat"><b id="pct">0%</b>Today</div><div class="stat"><b id="streak">0</b>Streak</div><div class="stat"><b id="done">0/27</b>Activities</div></div><div class="bar"><div class="fill" id="fill"></div></div></div><div class="card"><button id="all">Complete all</button><button class="secondary" id="reset">Reset</button></div><div id="app"></div><div class="card" id="sync">☁️ Google Sheets sync ready</div></main><script>
const URL="https://script.google.com/macros/s/AKfycbzuvWDEobeEQJ26FdAD1UPSIwzqy7yrOPbSkhfYW26nEiHKcUcqqgfWfIhk8PB06256Ow/exec";
const items=[
["Morning","5:30","Wake up",""],["Morning","5:35","Drink water","500–750 ml"],["Morning","5:35–5:45","Bathroom + freshen up",""],["Morning","5:45–5:55","Meditation / breathing","10 min"],["Morning","5:55–6:05","Change + prepare for gym",""],["Morning","6:05–7:35","🏋️ Gym block","Travel + ~60 min workout + return"],["Morning","7:35–7:50","Cool down + freshen up",""],["Morning","7:50–8:10","Bath + grooming",""],["Morning","8:10–8:25","Breakfast",""],["Morning","8:25–8:30","Pack essentials + leave",""],
["Morning Metro — 45 min","5 min","Settle in + plan",""],["Morning Metro — 45 min","25 min","💻 Deep learning / focused work","Laptop block"],["Morning Metro — 45 min","10 min","Practice / apply learning",""],["Morning Metro — 45 min","5 min","Write 3 key takeaways",""],
["Office","10:00–6:00","Workday completed",""],["Office","5 min","Plan tomorrow's top 3 priorities",""],
["Evening Metro — 45 min","20–25 min","📖 Reading / learning",""],["Evening Metro — 45 min","10 min","Review morning learning",""],["Evening Metro — 45 min","10–15 min","Relax / decompress",""],
["Evening","8:00–8:15","Change + unwind",""],["Evening","8:15–8:40","Dinner",""],["Evening","8:40–9:10","Family / personal time",""],["Evening","9:10–9:40","🚶 Evening walk","30 min"],["Evening","9:40–10:00","Prepare for tomorrow",""],["Evening","10:00–10:20","Light reading / relaxation",""],["Evening","10:20–10:30","Wind down — no screens",""],["Evening","10:30","😴 Sleep","Target 7–8 hours"]];
const today=()=>{const d=new Date();return new Intl.DateTimeFormat("en-CA").format(d)},key=()=>`routine-${today()}`;
let state=new Set(JSON.parse(localStorage.getItem(key())||"[]"));
function render(){document.getElementById("date").textContent=new Date().toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric",year:"numeric"});let root=document.getElementById("app");root.innerHTML="";let groups=[...new Set(items.map(x=>x[0]))];groups.forEach(g=>{let c=document.createElement("div");c.className="card";c.innerHTML=`<h2>${g}</h2>`;items.forEach((x,i)=>{if(x[0]!==g)return;let r=document.createElement("label");r.className="row"+(state.has(i)?" done":"");r.innerHTML=`<input type="checkbox" ${state.has(i)?"checked":""}><span class="time">${x[1]}</span><span>${x[2]}<span class="detail">${x[3]}</span></span>`;r.querySelector("input").onchange=()=>{state.has(i)?state.delete(i):state.add(i);localStorage.setItem(key(),JSON.stringify([...state]));render();sync()};c.append(r)});root.append(c)});let n=state.size,p=Math.round(n/items.length*100);document.getElementById("pct").textContent=p+"%";document.getElementById("done").textContent=n+"/"+items.length;document.getElementById("fill").style.width=p+"%"}
async function sync(){document.getElementById("sync").textContent="☁️ Saving to Google Sheets…";let data={date:today(),items:items.map((x,i)=>({activity:x[2],time:x[1],completed:state.has(i)}))};try{await fetch(URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(data)});document.getElementById("sync").textContent="☁️ Saved to Google Sheets"}catch(e){document.getElementById("sync").textContent="📱 Saved on iPad; Sheets sync unavailable"}}
document.getElementById("all").onclick=()=>{state=new Set(items.map((_,i)=>i));localStorage.setItem(key(),JSON.stringify([...state]));render();sync()};document.getElementById("reset").onclick=()=>{state=new Set;localStorage.setItem(key(),"[]");render();sync()};render();
</script></body></html>
